    jwtSecret: kashdsakdhaisdhwqhdu323uhewdwiuedhwiehdwiwdeiuhdwiuhwsoiajdaoidjas
    jwtExpiration: 15  #Minutes
    refreshTokenExpiration: 3 #Days
management:
  endpoints:
    enabled-by-default: false
  endpoint:
    health:
      show-details: never
      enabled: true

