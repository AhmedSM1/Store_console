# Rate limiting definition
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

upstream auth_upstream {
    server authorization:8070;
}

upstream products_upstream {
    server products:8080;
}

server {
    listen 80 default_server;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

location /authorization/ {
    proxy_pass http://auth_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /authorization;
}
    location /products/ {
        proxy_pass http://products_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /products;
    }
    # Health check for the Gateway itself
    location /health {
        access_log off;
        return 200 '{"status":"healthy"}';
        add_header Content-Type application/json;
    }
}