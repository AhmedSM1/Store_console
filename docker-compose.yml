services:
  authorization:
    build: ./authorization
    container_name: auth-service
    ports:
      - "5070:8070"
    depends_on:
      - postgres
    environment:
      - ENV=docker 
    networks:
      - store-network
  products:
    build: ./products
    container_name: products-service
    ports:
      - "5080:8080"
    depends_on:
      - mongodb
    networks:
      - store-network
    environment:
      - ENV=docker 
  postgres:
    image: postgres:16-alpine
    container_name: store-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=auth_db
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d
    networks:
      - store-network
  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONARQUBE_JDBC_URL=jdbc:postgresql://postgres:5432/sonarqube
      - SONARQUBE_JDBC_USERNAME=postgres
      - SONARQUBE_JDBC_PASSWORD=password
    networks:
      - store-network
  pgadmin:
    image: dpage/pgadmin4
    container_name: store-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - ./servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres
    networks:
      - store-network
  mongodb:
    image: mongo:latest 
    ports:
      - "27017:27017" 
    volumes:
      - ./init/mongo:/docker-entrypoint-initdb.d
    networks:
      - store-network
  mongo-express:
    image: mongo-express
    container_name: store-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb
    networks:
      - store-network
  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - authorization
      - products
    networks:
      - store-network
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - store-network
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.1
    container_name: logstash
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch
    networks:
      - store-network
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - store-network
  kibana-setup:
    image: curlimages/curl:latest
    container_name: kibana-setup
    depends_on:
      - kibana
    networks:
      - store-network
    volumes:
      - ./scripts/kibana-setup.sh:/usr/local/bin/kibana-setup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/kibana-setup.sh"]
    restart: on-failure
networks:
  store-network:
    driver: bridge
volumes:
  mongo-data:
    driver: local